version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraudguard_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/artifacts:/app/artifacts
      - ./backend/fraud_guard.db:/app/fraud_guard.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraudguard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
